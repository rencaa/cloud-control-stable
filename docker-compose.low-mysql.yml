services:
  mysql:
    volumes:
      - ./deploy/mysql-low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
    mem_limit: 640m
    mem_reservation: 384m
    memswap_limit: 896m
    cpus: 0.80
    pids_limit: 256

  mysql-backup:
    mem_limit: 160m
    mem_reservation: 32m
    memswap_limit: 256m
    cpus: 0.35
    pids_limit: 128

  server:
    environment:
      CLOUD_DB_MAX_OPEN_CONNS: 24
      CLOUD_DB_MAX_IDLE_CONNS: 8
      GOMEMLIMIT: 256MiB
      GOMAXPROCS: 2
    mem_limit: 384m
    mem_reservation: 128m
    memswap_limit: 640m
    cpus: 1.20
    pids_limit: 256

  nginx:
    mem_limit: 96m
    mem_reservation: 32m
    memswap_limit: 128m
    cpus: 0.35
    pids_limit: 128
